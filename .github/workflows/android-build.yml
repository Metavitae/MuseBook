name: Android build

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /usr/lib/jvm
          docker image prune -a -f || true
          df -h /

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build the offline page bundle
        run: npm run build:www

      - name: Type check
        run: npx tsc --noEmit

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        # "release" build type, but still signed with the auto-generated
        # debug keystore (android/app/build.gradle already falls back to
        # signingConfigs.debug for release when no real release credentials
        # are configured) — this is what actually matters here: a
        # standalone APK with the JS bundle embedded, matching what EAS's
        # preview builds produce. assembleDebug does NOT bundle JS by
        # default and instead expects a live Metro connection, which just
        # opens expo-dev-client's launcher screen with nothing to load.
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with the MuseBook release key
        # Only when the key is stored as repo secrets. Without them the APK
        # keeps the debug signature, so update-installs on test phones still
        # work. The key never lives in this (public) repo.
        env:
          KEYSTORE_B64: ${{ secrets.MUSEBOOK_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.MUSEBOOK_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias musebook \
            --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "certificate DN"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musebook-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
